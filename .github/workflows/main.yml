name: Polaris Scan SAST


on: [push,workflow_dispatch]

jobs:
  polaris:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout source code
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Verify Python and pip
      - name: Verify Python and pip
        run: |
          python --version
          python -m pip --version

      # 4. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      # --------------------------------------------------
      # Installing the requirements
      # --------------------------------------------------
      - name: Installing the Dependcies
        run: pip install -r requirements.txt
      # --------------------------------------------------
      # Download Black Duck Bridge CLI
      # --------------------------------------------------
      - name: Download Bridge CLI
        run: |
          curl -fLsS -o bridge.zip \
            https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-linux64.zip
          unzip -q bridge.zip
          chmod +x bridge-cli-bundle-linux64/bridge-cli

      # --------------------------------------------------
      # Run Polaris SAST Scan
      # --------------------------------------------------
      - name: Run Polaris SAST
        env:
          POLARIS_SERVER_URL: ${{ secrets.POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        run: |
          ./bridge-cli-bundle-linux64/bridge-cli \
            --stage polaris \
            polaris.serverUrl=$POLARIS_SERVER_URL \
            polaris.accessToken=$POLARIS_ACCESS_TOKEN \
            polaris.application.name=Password_Manager_Arul \
            polaris.project.name=Password_Manager \
            polaris.branch.name=main \
            polaris.assessment.types=SCA,SAST,SCA-SIGNATURE
