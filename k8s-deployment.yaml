apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-manager-app
  labels:
    app: password-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: password-manager
  template:
    metadata:
      labels:
        app: password-manager
    spec:
      containers:
      - name: password-manager
        image: password-manager:latest
        imagePullPolicy: Never  # Forces K8s to use the local Docker image built by Jenkins
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: password-manager-service
spec:
  type: NodePort
  selector:
    app: password-manager
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080  # Exposes the application locally on http://localhost:30080